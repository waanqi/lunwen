  <text x="502" y="1012" text-anchor="middle" class="t s"><tspan x="502">构型设计</tspan><tspan x="502" dy="30">刚性杆件</tspan><tspan x="502" dy="30">活动底边</tspan></text>
  <rect x="647" y="974" width="245" height="118" rx="5" class="box"/>

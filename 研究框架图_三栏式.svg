  <rect x="380" y="1715" width="245" height="105" rx="5" class="box"/>
  <text x="502" y="1754" text-anchor="middle" class="t s"><tspan x="502">结构与功能测试</tspan><tspan x="502" dy="32">运动、负载、换装</tspan></text>
  <rect x="647" y="1715" width="245" height="105" rx="5" class="box"/>
  <text x="769" y="1754" text-anchor="middle" class="t s"><tspan x="769">ADL 任务评价</tspan><tspan x="769" dy="32">典型日常活动</tspan></text>
  <rect x="914" y="1715" width="246" height="105" rx="5" class="box"/>
  <text x="1037" y="1754" text-anchor="middle" class="t s"><tspan x="1037">用户主观评价</tspan><tspan x="1037" dy="32">可用性与体验</tspan></text>
  <rect x="380" y="1835" width="780" height="45" rx="5" class="box"/>
  <text x="770" y="1866" text-anchor="middle" class="t s">综合验证系统的有效性、适配性与设计价值</text>

  <!-- Center row 7 -->
  <rect x="380" y="1925" width="780" height="55" rx="5" class="bar"/>

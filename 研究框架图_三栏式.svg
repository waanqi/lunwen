  <text x="1037" y="1383" text-anchor="middle" class="t s"><tspan x="1037">控制映射与逻辑</tspan><tspan x="1037" dy="36">软硬件系统集成</tspan><tspan x="1037" dy="36">整机原型实现</tspan></text>
  <path d="M625 1388 H642" class="line" marker-end="url(#arrow)"/>
  <path d="M892 1388 H909" class="line" marker-end="url(#arrow)"/>
  <rect x="380" y="1512" width="780" height="83" rx="5" class="box"/>
  <text x="770" y="1546" text-anchor="middle" class="t s"><tspan x="770">三项创新协同：刚柔耦合结构创新　＋　末端工具模块创新</tspan><tspan x="770" dy="31">＋　基于手势分类的健—患侧联动控制创新</tspan></text>

  <!-- Center row 6 -->
  <rect x="380" y="1640" width="780" height="55" rx="5" class="bar"/>

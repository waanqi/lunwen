  <rect x="1260" y="1958" width="290" height="130" class="goal"/>
  <text x="1405" y="2014" text-anchor="middle" class="t s"><tspan x="1405">凝练研究结论，</tspan><tspan x="1405" dy="34">提出后续方向</tspan></text>

  <text x="800" y="2122" text-anchor="middle" class="t s">研究主线：需求驱动 → 结构创新 → 模块整合 → 交互实现 → 情境验证</text>

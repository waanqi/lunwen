  <rect x="380" y="1995" width="245" height="70" rx="5" class="box"/>
  <text x="502" y="2039" text-anchor="middle" class="t s">研究成果与结论</text>
  <rect x="647" y="1995" width="245" height="70" rx="5" class="box"/>
  <text x="769" y="2039" text-anchor="middle" class="t s">创新点归纳与讨论</text>
  <rect x="914" y="1995" width="246" height="70" rx="5" class="box"/>
  <text x="1037" y="2039" text-anchor="middle" class="t s">局限与后续展望</text>


<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2140" viewBox="0 0 1600 2140">
  <title>基于刚柔耦合Kresling结构的健—患侧联动控制模块化假肢腕部系统研究框架</title>
  <desc>三栏式纵向研究框架图，左侧为研究框架，中间为研究内容，右侧为阶段目标。</desc>
  <defs>
    <style>
      .t{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1d1d1d}
      .h{font-size:30px;font-weight:700}.s{font-size:21px}.m{font-size:23px;font-weight:600}.b{font-size:24px;font-weight:600}
      .box{fill:#fff;stroke:#202020;stroke-width:2}.bar{fill:#bec2c6;stroke:#202020;stroke-width:2}.goal{fill:#f0f3f9;stroke:#202020;stroke-width:2}
      .line{fill:none;stroke:#202020;stroke-width:2}.dash{fill:none;stroke:#202020;stroke-width:3;stroke-dasharray:7 8}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#202020" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="1600" height="2140" fill="#ffffff"/>

  <!-- Three column headers -->
